<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Cargar USDC</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    iframe {
      width: 420px;
      height: 640px;
      border: none;
      border-radius: 12px;
    }
  </style>
</head>
<body>

<iframe
  src="https://global.transak.com?apiKey={{ transak_api_key }}
    &environment=STAGING
    &cryptoCurrencyCode=USDC
    &network=arbitrum
    &walletAddress={{ wallet_address }}
    &fiatCurrency=USD
    &defaultFiatAmount=50
    &disableWalletAddressForm=true
    &hideMenu=true">
</iframe>

</body>
</html>
